<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Opportunity Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f0f13;--bg2:#17171e;--bg3:#1e1e28;--bg4:#25252f;
--border:#2a2a38;--border2:#35354a;
--text:#e8e8f0;--text2:#9090a8;--text3:#606078;
--accent:#6366f1;--accent2:#818cf8;
--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
[data-theme=light]{
--bg:#f0f0f8;--bg2:#ffffff;--bg3:#e8e8f4;--bg4:#dcdcec;
--border:#d0d0e0;--border2:#b8b8cc;
--text:#1a1a2e;--text2:#4a4a6a;--text3:#8080a0;
--shadow:0 4px 24px rgba(0,0,0,.12);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif}
a{color:var(--accent2);text-decoration:none}
input,select,textarea{font-family:inherit;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;font-size:14px;font-weight:500;transition:.2s}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;background:linear-gradient(135deg,#6366f1,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.search-wrap{flex:1;max-width:400px;position:relative}
.search-wrap input{width:100%;padding-left:36px;background:var(--bg3)}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.header-stats{display:flex;gap:16px;margin-left:auto}
.hstat{text-align:center;line-height:1.2}
.hstat b{font-size:16px;font-weight:700;color:var(--accent2)}
.hstat small{font-size:11px;color:var(--text3)}
.btn-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2)}
.btn-icon:hover{border-color:var(--accent);color:var(--text)}

/* LAYOUT */
.layout{display:flex;height:calc(100vh - 60px)}
.sidebar{width:260px;min-width:0;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:16px;position:relative;transition:width .2s,padding .2s}
.sidebar.collapsed{width:0;padding:0;overflow:hidden}
.resize-handle{width:5px;position:absolute;top:0;right:0;bottom:0;cursor:col-resize;background:transparent;z-index:10}
.resize-handle:hover{background:var(--accent)}
.sb-toggle{position:absolute;top:50%;right:-16px;transform:translateY(-50%);width:16px;height:40px;background:var(--bg2);border:1px solid var(--border);border-left:none;border-radius:0 6px 6px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text3);z-index:20}
.sb-toggle:hover{color:var(--text);background:var(--bg3)}
.main{flex:1;overflow-y:auto;padding:20px}

/* SIDEBAR */
.sb-section{margin-bottom:20px}
.sb-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-btn{background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;text-align:left;color:var(--text2);font-size:13px;display:flex;align-items:center;gap:8px;width:100%}
.filter-btn:hover{background:var(--bg3);color:var(--text)}
.filter-btn.active{background:rgba(99,102,241,.15);border-color:var(--accent);color:var(--accent2)}
.filter-btn .cnt{margin-left:auto;font-size:11px;background:var(--bg4);padding:1px 6px;border-radius:20px}
.filter-btn.active .cnt{background:rgba(99,102,241,.3)}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
select.sb-select{width:100%;margin-top:4px}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.2s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--border2)}
.card-header{height:72px;display:flex;align-items:center;padding:0 16px;gap:12px;position:relative;overflow:hidden}
.card-header::before{content:'';position:absolute;inset:0;opacity:.15}
.card-emoji{font-size:28px;position:relative;z-index:1}
.card-title-wrap{position:relative;z-index:1;flex:1;min-width:0}
.card-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-cat{font-size:11px;opacity:.8;margin-top:2px}
.fav-btn{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.3);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;z-index:2;transition:.2s}
.fav-btn:hover{transform:scale(1.2)}
.card-body{padding:12px 16px}
.card-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.earn-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px}
.earn-cell{background:var(--bg3);border-radius:8px;padding:6px 8px;text-align:center}
.earn-cell small{display:block;font-size:10px;color:var(--text3);margin-bottom:2px}
.earn-cell b{font-size:13px;font-weight:600}
.diff-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.diff-label{font-size:11px;font-weight:600;min-width:70px}
.diff-bar{flex:1;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.diff-fill{height:100%;border-radius:3px;transition:.4s}
.diff-pct{font-size:11px;color:var(--text3);min-width:30px;text-align:right}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 7px;border-radius:12px;background:var(--bg4);color:var(--text2)}
.status-badge{position:absolute;bottom:10px;right:10px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:12px;cursor:pointer}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-head{padding:0 24px;height:64px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head-emoji{font-size:32px}
.modal-head-info{flex:1}
.modal-head-info h2{font-size:18px;font-weight:700}
.modal-head-info p{font-size:12px;color:var(--text2);margin-top:2px}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);border-radius:8px;cursor:pointer;color:var(--text2);font-size:18px}
.modal-close:hover{color:var(--text)}
.tabs{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:8px 14px;font-size:13px;font-weight:500;border-radius:8px 8px 0 0;cursor:pointer;color:var(--text2);border:1px solid transparent;border-bottom:none;margin-bottom:-1px;background:none}
.tab.active{background:var(--bg3);color:var(--text);border-color:var(--border);border-bottom-color:var(--bg3)}
.modal-body{flex:1;overflow-y:auto;padding:20px 24px}

/* TAB PANELS */
.tab-panel{display:none}
.tab-panel.active{display:block}

/* OVERVIEW */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.info-card{background:var(--bg3);border-radius:10px;padding:14px}
.info-card label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.info-card .val{font-size:15px;font-weight:600}
.earn-big{background:var(--bg3);border-radius:10px;padding:14px;margin-bottom:16px}
.earn-big-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px}
.earn-big-cell{text-align:center;background:var(--bg4);border-radius:8px;padding:10px}
.earn-big-cell small{display:block;font-size:11px;color:var(--text3)}
.earn-big-cell b{font-size:20px;font-weight:700}
.section-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}

/* COMPETITORS */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.comp-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px}
.comp-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.comp-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.comp-name{font-weight:600;font-size:14px}
.comp-rating{font-size:12px;color:#fbbf24}
.comp-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.comp-stat{background:var(--bg4);border-radius:6px;padding:5px 8px}
.comp-stat small{display:block;font-size:10px;color:var(--text3)}
.comp-stat b{font-size:12px;font-weight:600}
.comp-features{margin-bottom:8px}
.comp-features li{font-size:12px;color:var(--text2);margin-left:14px;margin-bottom:2px}
.opp-box{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);border-radius:7px;padding:8px;font-size:12px;color:var(--accent2)}

/* BUILD GUIDE */
.build-steps{display:flex;flex-direction:column;gap:12px}
.build-step{background:var(--bg3);border-radius:10px;padding:14px;display:flex;gap:12px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;margin-top:2px}
.step-body h4{font-size:14px;font-weight:600;margin-bottom:4px}
.step-body p{font-size:13px;color:var(--text2);line-height:1.5}

/* NOTES */
.notes-area{width:100%;min-height:200px;resize:vertical;font-size:14px;line-height:1.6}

/* ADD MODAL */
.add-modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;font-weight:500;margin-bottom:5px;color:var(--text2)}
.form-row input,.form-row select,.form-row textarea{width:100%}
.btn{padding:9px 18px;border-radius:8px;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-danger{background:#ef4444;color:#fff}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.fab{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(99,102,241,.5);z-index:50}
.fab:hover{background:var(--accent2);transform:scale(1.05)}
.toast{position:fixed;bottom:80px;right:24px;background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:10px 16px;font-size:13px;z-index:300;transform:translateY(20px);opacity:0;transition:.3s;pointer-events:none}
.toast.show{transform:none;opacity:1}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty h3{font-size:18px;margin-bottom:8px;color:var(--text2)}
.top-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top-bar h2{font-size:18px;font-weight:700;flex:1}
.sort-sel{padding:6px 10px;font-size:13px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;background:rgba(99,102,241,.2);color:var(--accent2)}
</style>
</head>
<body>

<header class="header">
  <div class="logo">🚀 AppHub</div>
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Search apps…">
  </div>
  <div class="header-stats" id="headerStats"></div>
  <button class="btn-icon" onclick="toggleTheme()" title="Toggle theme">🌓</button>
  <button class="btn-icon" onclick="showAdd()" title="Add app">+</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="resize-handle" id="resizeHandle"></div>
    <button class="sb-toggle" id="sbToggle" onclick="toggleSidebar()" title="Collapse/expand">◀</button>
    <div class="sb-section">
      <div class="sb-title">Category</div>
      <div class="filter-group" id="catFilters"></div>
    </div>
    <div class="sb-section">
      <div class="sb-title">Min Daily Earnings</div>
      <select class="sb-select" id="dailyFilter" onchange="setDaily(this.value)">
        <option value="0">Any earnings</option>
        <option value="5">$5+/day</option>
        <option value="10">$10+/day</option>
        <option value="20">$20+/day</option>
        <option value="50">$50+/day</option>
        <option value="100">$100+/day</option>
        <option value="200">$200+/day</option>
        <option value="500">$500+/day</option>
        <option value="1000">$1,000+/day</option>
      </select>
    </div>
    <div class="sb-section">
      <div class="sb-title">Difficulty</div>
      <div class="filter-group" id="diffFilters"></div>
    </div>
    <div class="sb-section">
      <div class="sb-title">Status</div>
      <div class="filter-group" id="statusFilters"></div>
    </div>
    <div class="sb-section">
      <button class="filter-btn" id="favToggle" onclick="toggleFav()">❤️ Favorites only</button>
    </div>
    <div class="sb-section">
      <div class="sb-title">Actions</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn btn-ghost" style="width:100%;font-size:12px" onclick="exportData()">📤 Export JSON</button>
        <label class="btn btn-ghost" style="width:100%;font-size:12px;text-align:center;cursor:pointer">📥 Import JSON<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top-bar">
      <h2 id="mainTitle">All Apps</h2>
      <span class="badge" id="countBadge">0 apps</span>
      <select class="sort-sel" id="sortSel" onchange="setSort(this.value)">
        <option value="revenue">Sort: Revenue</option>
        <option value="daily">Sort: Daily $$</option>
        <option value="diff_easy">Sort: Easiest first</option>
        <option value="diff_hard">Sort: Hardest first</option>
        <option value="name">Sort: Name</option>
        <option value="status">Sort: Status</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<!-- Detail Modal -->
<div class="overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-head-emoji" id="mEmoji"></div>
      <div class="modal-head-info">
        <h2 id="mName"></h2>
        <p id="mMeta"></p>
      </div>
      <button class="modal-close" onclick="closeDetailDirect()">✕</button>
    </div>
    <div class="tabs" id="modalTabs"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- Add Modal -->
<div class="overlay" id="addOverlay" onclick="closeAdd(event)">
  <div class="add-modal">
    <h3 style="margin-bottom:16px;font-size:16px">Add New App Idea</h3>
    <div class="form-row"><label>App Name *</label><input id="fName" placeholder="e.g. FitTrack Pro"></div>
    <div class="form-row"><label>Category *</label>
      <select id="fCat">
        <option value="">Select category…</option>
      </select>
    </div>
    <div class="form-row"><label>Description</label><input id="fDesc" placeholder="What does it do?"></div>
    <div class="form-row"><label>Revenue Estimate</label><input id="fRev" placeholder="e.g. $50k–150k/mo"></div>
    <div class="form-row"><label>Target Audience</label><input id="fAud" placeholder="e.g. Fitness enthusiasts"></div>
    <div class="form-row"><label>Key Features (comma-separated)</label><input id="fFeats" placeholder="e.g. Workout tracker, Nutrition log"></div>
    <div class="form-row"><label>Notes</label><textarea id="fNotes" rows="3" placeholder="Any additional thoughts…"></textarea></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeAddDirect()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAdd()">Add App</button>
    </div>
  </div>
</div>

<button class="fab" onclick="showAdd()">+</button>
<div class="toast" id="toast"></div>

    {name:'Robinhood',icon:'📈',color:'#22c55e',rating:'4.1',downloads:'15M+',rev:'$20M/mo',features:['Stock trading','Crypto','Options'],opp:'Better education for beginners'},

function parseMonthly(rev){
  if(!rev)return 0;
  const m=rev.match(/\$(\d+(?:\.\d+)?)(k|M)?(?:[–-]\$?(\d+(?:\.\d+)?)(k|M)?)?/i);
  if(!m)return 0;
  const mult=s=>s&&s.toLowerCase()==='m'?1000000:s&&s.toLowerCase()==='k'?1000:1;
  const lo=parseFloat(m[1])*mult(m[2]);
  const hi=m[3]?parseFloat(m[3])*mult(m[4]):lo;
  return(lo+hi)/2;
}
function getEarnings(rev){
  const mo=parseMonthly(rev);
  if(!mo)return{d:'—',w:'—',m:'—',daily:0};
  const fmt=n=>n>=1000000?'$'+(n/1000000).toFixed(1)+'M':n>=1000?'$'+(n/1000).toFixed(0)+'k':'$'+Math.round(n);
  return{d:fmt(mo/30),w:fmt(mo/4.3),m:fmt(mo),daily:mo/30};
}
function getDiff(rev){
  const mo=parseMonthly(rev);
  if(mo>=800000)return{label:'Expert',pct:10,color:'#ef4444'};
  if(mo>=400000)return{label:'Very Hard',pct:22,color:'#f97316'};
  if(mo>=150000)return{label:'Hard',pct:38,color:'#eab308'};
  if(mo>=50000) return{label:'Medium',pct:58,color:'#3b82f6'};
  if(mo>=15000) return{label:'Easy',pct:76,color:'#22c55e'};
  return{label:'Very Easy',pct:92,color:'#10b981'};
}

let projects=[],notes={},prefs={theme:'dark',sort:'revenue'},favs=new Set(),activeId=null;
let filters={cats:[],status:[],diff:[],favOnly:false,query:'',minDaily:0,sort:'revenue'};

function loadData(){
  const seeded=localStorage.getItem(SEED_KEY);
  if(seeded!==SEED_VER){
    projects=SEED_APPS.map((a,i)=>({...a,id:'s'+i,createdAt:Date.now()-i*1000}));
    localStorage.setItem(SK,JSON.stringify(projects));
    localStorage.setItem(SEED_KEY,SEED_VER);
  }else{
    try{projects=JSON.parse(localStorage.getItem(SK)||'[]')}catch{projects=[]}
  }
  try{notes=JSON.parse(localStorage.getItem(NK)||'{}')}catch{notes={}}
  try{prefs=JSON.parse(localStorage.getItem(PK)||'{}')}catch{prefs={}}
  try{favs=new Set(JSON.parse(localStorage.getItem(FK)||'[]'))}catch{favs=new Set()}
  document.documentElement.dataset.theme=prefs.theme||'dark';
  filters.sort=prefs.sort||'revenue';
  document.getElementById('sortSel').value=filters.sort;
}
function saveProjects(){localStorage.setItem(SK,JSON.stringify(projects))}
function saveFavs(){localStorage.setItem(FK,JSON.stringify([...favs]))}
function saveNotes(){localStorage.setItem(NK,JSON.stringify(notes))}
function savePrefs(){localStorage.setItem(PK,JSON.stringify(prefs))}

function buildSidebar(){
  // Categories
  const cf=document.getElementById('catFilters');
  cf.innerHTML='<button class="filter-btn active" onclick="toggleCat(null,this)"><span>🌐</span> All categories<span class="cnt" id="cnt-all">'+projects.length+'</span></button>';
  Object.entries(CAT).forEach(([name,c])=>{
    const count=projects.filter(p=>p.cat===name).length;
    if(!count)return;
    const btn=document.createElement('button');
    btn.className='filter-btn';
    btn.innerHTML=`<span class="cat-dot" style="background:${c.color}"></span>${c.emoji} ${name}<span class="cnt">${count}</span>`;
    btn.onclick=()=>toggleCat(name,btn);
    cf.appendChild(btn);
  });
  // Diffs
  const df=document.getElementById('diffFilters');
  df.innerHTML='';
  DIFFS.forEach(d=>{
    const btn=document.createElement('button');
    btn.className='filter-btn';
    btn.textContent=d;
    btn.onclick=()=>{
      btn.classList.toggle('active');
      const i=filters.diff.indexOf(d);
      if(i>-1)filters.diff.splice(i,1);else filters.diff.push(d);
      render();
    };
    df.appendChild(btn);
  });
  // Status
  const sf=document.getElementById('statusFilters');
  sf.innerHTML='';
  STATUSES.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='filter-btn';
    btn.textContent=STATUS_TEXT[s];
    btn.onclick=()=>{
      btn.classList.toggle('active');
      const i=filters.status.indexOf(s);
      if(i>-1)filters.status.splice(i,1);else filters.status.push(s);
      render();
    };
    sf.appendChild(btn);
  });
  // Add cats to add form
  const fCat=document.getElementById('fCat');
  Object.keys(CAT).forEach(c=>{
    const o=document.createElement('option');
    o.value=c;o.textContent=c;
    fCat.appendChild(o);
  });
}
function toggleCat(name,btn){
  document.querySelectorAll('#catFilters .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filters.cats=name?[name]:[];
  render();
}
function toggleFav(){
  filters.favOnly=!filters.favOnly;
  document.getElementById('favToggle').classList.toggle('active',filters.favOnly);
  render();
}
function setDaily(v){filters.minDaily=parseFloat(v)||0;render()}
function setSort(v){filters.sort=v;prefs.sort=v;savePrefs();render()}

function getFiltered(){
  let r=[...projects];
  if(filters.cats.length)r=r.filter(p=>filters.cats.includes(p.cat));
  if(filters.status.length)r=r.filter(p=>filters.status.includes(p.status));
  if(filters.diff.length)r=r.filter(p=>filters.diff.includes(getDiff(p.rev).label));
  if(filters.favOnly)r=r.filter(p=>favs.has(p.id));
  if(filters.minDaily>0)r=r.filter(p=>getEarnings(p.rev).daily>=filters.minDaily);
  if(filters.query){
    const q=filters.query.toLowerCase();
    r=r.filter(p=>(p.name+' '+p.desc+' '+p.cat).toLowerCase().includes(q));
  }
  const s=filters.sort;
  r.sort((a,b)=>{
    if(s==='revenue')return parseMonthly(b.rev)-parseMonthly(a.rev);
    if(s==='daily')return getEarnings(b.rev).daily-getEarnings(a.rev).daily;
    if(s==='diff_easy')return getDiff(b.rev).pct-getDiff(a.rev).pct;
    if(s==='diff_hard')return getDiff(a.rev).pct-getDiff(b.rev).pct;
    if(s==='name')return a.name.localeCompare(b.name);
    if(s==='status')return STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status);
    return 0;
  });
  return r;
}

function render(){
  const list=getFiltered();
  document.getElementById('countBadge').textContent=list.length+' app'+(list.length!==1?'s':'');
  const grid=document.getElementById('grid');
  if(!list.length){
    grid.innerHTML='<div class="empty" style="grid-column:1/-1"><h3>No apps found</h3><p>Try adjusting your filters</p></div>';
    return;
  }
  grid.innerHTML=list.map(p=>renderCard(p)).join('');
  updateHeaderStats();
}
function renderCard(p){
  const c=CAT[p.cat]||{emoji:'📱',color:'#6366f1',bg:'linear-gradient(135deg,#312e81,#3730a3)'};
  const e=getEarnings(p.rev);
  const d=getDiff(p.rev);
  const isFav=favs.has(p.id);
  const tags=(p.feats||[]).slice(0,3);
  const sc=STATUS_COLORS[p.status]||STATUS_COLORS.idea;
  const st=STATUS_TEXT[p.status]||STATUS_TEXT.idea;
  return`<div class="card" onclick="openDetail('${p.id}')">
    <div class="card-header" style="background:${c.bg}">
      <div class="card-emoji">${c.emoji}</div>
      <div class="card-title-wrap">
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-cat" style="color:${c.color}">${p.cat}</div>
      </div>
      <button class="fav-btn" onclick="event.stopPropagation();toggleFavItem('${p.id}')">${isFav?'❤️':'🤍'}</button>
    </div>
    <div class="card-body">
      <div class="card-desc">${esc(p.desc||'')}</div>
      <div class="earn-row">
        <div class="earn-cell"><small>Daily</small><b style="color:${c.color}">${e.d}</b></div>
        <div class="earn-cell"><small>Weekly</small><b>${e.w}</b></div>
        <div class="earn-cell"><small>Monthly</small><b>${e.m}</b></div>
      </div>
      <div class="diff-row">
        <span class="diff-label" style="color:${d.color}">${d.label}</span>
        <div class="diff-bar"><div class="diff-fill" style="width:${d.pct}%;background:${d.color}"></div></div>
        <span class="diff-pct">${d.pct}%</span>
      </div>
      <div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div>
    <span class="status-badge" style="background:${sc}" onclick="event.stopPropagation();cycleStatus('${p.id}')">${st}</span>
  </div>`;
}

function toggleFavItem(id){
  if(favs.has(id))favs.delete(id);else favs.add(id);
  saveFavs();
  render();
}
function cycleStatus(id){
  const p=projects.find(x=>x.id===id);
  if(!p)return;
  const i=STATUSES.indexOf(p.status);
  p.status=STATUSES[(i+1)%STATUSES.length];
  saveProjects();render();toast('Status → '+STATUS_TEXT[p.status]);
}

function updateHeaderStats(){
  const all=getFiltered();
  const totalMo=all.reduce((s,p)=>s+parseMonthly(p.rev),0)/all.length||0;
  const launched=projects.filter(p=>p.status==='launched').length;
  const favCount=projects.filter(p=>favs.has(p.id)).length;
  const fmt=n=>n>=1000000?'$'+(n/1000000).toFixed(1)+'M':n>=1000?'$'+(n/1000).toFixed(0)+'k':'$'+Math.round(n);
  document.getElementById('headerStats').innerHTML=`
    <div class="hstat"><b>${projects.length}</b><small>Total Apps</small></div>
    <div class="hstat"><b>${launched}</b><small>Launched</small></div>
    <div class="hstat"><b>${favCount}</b><small>Favorites</small></div>
    <div class="hstat"><b>${fmt(totalMo)}</b><small>Avg Revenue</small></div>
  `;
}

// DETAIL MODAL
function openDetail(id){
  const p=projects.find(x=>x.id===id);
  if(!p)return;
  activeId=id;
  const c=CAT[p.cat]||{emoji:'📱',color:'#6366f1'};
  const e=getEarnings(p.rev);
  const d=getDiff(p.rev);
  document.getElementById('mEmoji').textContent=c.emoji;
  document.getElementById('mName').textContent=p.name;
  document.getElementById('mMeta').textContent=p.cat+' · '+d.label+' · '+(p.status||'idea');
  // Tabs
  const tabs=['Overview','Competitors','Build Guide','Notes'];
  document.getElementById('modalTabs').innerHTML=tabs.map((t,i)=>
    `<button class="tab${i===0?' active':''}" onclick="switchTab(${i},this)">${t}</button>`
  ).join('');
  // Body
  renderTabContent(0,p,e,d,c);
  document.getElementById('detailOverlay').classList.add('open');
}
function switchTab(idx,btn){
  document.querySelectorAll('#modalTabs .tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  const p=projects.find(x=>x.id===activeId);
  const c=CAT[p.cat]||{emoji:'📱',color:'#6366f1'};
  const e=getEarnings(p.rev);
  const d=getDiff(p.rev);
  renderTabContent(idx,p,e,d,c);
}
function renderTabContent(idx,p,e,d,c){
  const body=document.getElementById('modalBody');
  if(idx===0){
    body.innerHTML=`
      <div class="earn-big">
        <div class="section-title">💰 Revenue Potential</div>
        <div class="earn-big-row">
          <div class="earn-big-cell"><small>Daily</small><b style="color:${c.color}">${e.d}</b></div>
          <div class="earn-big-cell"><small>Weekly</small><b>${e.w}</b></div>
          <div class="earn-big-cell"><small>Monthly</small><b>${e.m}</b></div>
        </div>
      </div>
      <div class="overview-grid">
        <div class="info-card"><label>Category</label><div class="val">${c.emoji} ${p.cat}</div></div>
        <div class="info-card"><label>Competition</label><div class="val" style="color:${d.color}">${d.label} (${d.pct}% chance)</div></div>
        <div class="info-card"><label>Target Audience</label><div class="val">${esc(p.aud||'—')}</div></div>
        <div class="info-card"><label>Priority</label><div class="val">${p.priority||'medium'}</div></div>
      </div>
      <div class="section-title">📋 Description</div>
      <p style="font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:16px">${esc(p.desc||'')}</p>
      <div class="section-title">⚡ Key Features</div>
      <ul style="margin-left:16px">${(p.feats||[]).map(f=>`<li style="font-size:14px;color:var(--text2);margin-bottom:4px">${esc(f)}</li>`).join('')}</ul>
      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="editModal()">✏️ Edit</button>
        <button class="btn btn-ghost" onclick="toggleFavItem('${p.id}');renderTabContent(0,projects.find(x=>x.id==='${p.id}'),getEarnings(projects.find(x=>x.id==='${p.id}').rev),getDiff(projects.find(x=>x.id==='${p.id}').rev),CAT[projects.find(x=>x.id==='${p.id}').cat]||{emoji:'📱',color:'#6366f1'})">${favs.has(p.id)?'💔 Unfavorite':'❤️ Favorite'}</button>
        <button class="btn btn-danger" style="margin-left:auto" onclick="deleteApp('${p.id}')">🗑️ Delete</button>
      </div>
    `;
  }else if(idx===1){
    const comps=(COMPS[p.cat]||[]);
    body.innerHTML=`<div class="section-title">🔍 Competitor Analysis — ${p.cat}</div>
      <div class="comp-grid">${comps.map(comp=>`
        <div class="comp-card">
          <div class="comp-top">
            <div class="comp-icon" style="background:${comp.color}20;color:${comp.color}">${comp.icon}</div>
            <div><div class="comp-name">${esc(comp.name)}</div><div class="comp-rating">★ ${comp.rating}</div></div>
          </div>
          <div class="comp-stats">
            <div class="comp-stat"><small>Downloads</small><b>${comp.downloads}</b></div>
            <div class="comp-stat"><small>Revenue</small><b>${comp.rev}</b></div>
          </div>
          <div class="comp-features"><ul>${comp.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
          <div class="opp-box">🎯 ${esc(comp.opp)}</div>
        </div>
      `).join('')}</div>`;
  }else if(idx===2){
    const steps=getBuildGuide(p.cat);
    body.innerHTML=`<div class="section-title">🏗️ Build Guide — ${p.name}</div>
      <div class="build-steps">${steps.map((s,i)=>`
        <div class="build-step">
          <div class="step-num">${i+1}</div>
          <div class="step-body"><h4>${esc(s.title)}</h4><p>${esc(s.desc)}</p></div>
        </div>
      `).join('')}</div>`;
  }else{
    const note=notes[p.id]||'';
    body.innerHTML=`<div class="section-title">📝 Notes for ${esc(p.name)}</div>
      <textarea class="notes-area" id="noteArea" placeholder="Write your notes here…">${esc(note)}</textarea>
      <div class="btn-row"><button class="btn btn-primary" onclick="saveNote()">Save Notes</button></div>`;
  }
}
function saveNote(){
  const p=projects.find(x=>x.id===activeId);
  if(!p)return;
  notes[activeId]=document.getElementById('noteArea').value;
  saveNotes();toast('Notes saved!');
}
function deleteApp(id){
  if(!confirm('Delete this app idea?'))return;
  projects=projects.filter(p=>p.id!==id);
  saveProjects();closeDetailDirect();render();toast('Deleted');
}
function editModal(){
  const p=projects.find(x=>x.id===activeId);
  if(!p)return;
  document.getElementById('fName').value=p.name;
  document.getElementById('fCat').value=p.cat;
  document.getElementById('fDesc').value=p.desc||'';
  document.getElementById('fRev').value=p.rev||'';
  document.getElementById('fAud').value=p.aud||'';
  document.getElementById('fFeats').value=(p.feats||[]).join(', ');
  document.getElementById('fNotes').value=notes[activeId]||'';
  closeDetailDirect();
  document.getElementById('addOverlay').classList.add('open');
}
function closeDetail(e){if(e.target===document.getElementById('detailOverlay'))closeDetailDirect()}
function closeDetailDirect(){document.getElementById('detailOverlay').classList.remove('open');activeId=null}

// ADD MODAL
function showAdd(){
  document.getElementById('fName').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fRev').value='';
  document.getElementById('fAud').value='';
  document.getElementById('fFeats').value='';
  document.getElementById('fNotes').value='';
  document.getElementById('addOverlay').classList.add('open');
}
function closeAdd(e){if(e.target===document.getElementById('addOverlay'))closeAddDirect()}
function closeAddDirect(){document.getElementById('addOverlay').classList.remove('open')}
function saveAdd(){
  const name=document.getElementById('fName').value.trim();
  const cat=document.getElementById('fCat').value;
  if(!name||!cat){toast('Name and category required');return}
  const featsRaw=document.getElementById('fFeats').value;
  const feats=featsRaw?featsRaw.split(',').map(f=>f.trim()).filter(Boolean):[];
  const id='u'+Date.now();
  const p={id,name,cat,
    desc:document.getElementById('fDesc').value.trim(),
    rev:document.getElementById('fRev').value.trim(),
    aud:document.getElementById('fAud').value.trim(),
    feats,priority:'medium',status:'idea',createdAt:Date.now()};
  const noteText=document.getElementById('fNotes').value.trim();
  if(noteText)notes[id]=noteText;
  projects.unshift(p);
  saveProjects();saveNotes();
  closeAddDirect();render();buildSidebar();toast('App added!');
}

// SEARCH
document.getElementById('searchInput').addEventListener('input',e=>{
  filters.query=e.target.value;render();
});

// THEME
function toggleTheme(){
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;
  prefs.theme=t;savePrefs();
}

// EXPORT / IMPORT
function exportData(){
  const data={projects,notes,favs:[...favs]};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='apphub-export.json';a.click();
  toast('Exported!');
}
function importData(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(data.projects)projects=data.projects;
      if(data.notes)notes=data.notes;
      if(data.favs)favs=new Set(data.favs);
      saveProjects();saveNotes();saveFavs();
      render();buildSidebar();toast('Imported '+projects.length+' apps!');
    }catch{toast('Invalid JSON file')}
  };
  reader.readAsText(file);
}

// SIDEBAR RESIZE
const sidebar=document.getElementById('sidebar');
const handle=document.getElementById('resizeHandle');
let isResizing=false;
handle.addEventListener('mousedown',e=>{isResizing=true;document.body.style.cursor='col-resize';e.preventDefault();});
document.addEventListener('mousemove',e=>{if(!isResizing)return;const rect=sidebar.getBoundingClientRect();const w=Math.max(160,Math.min(500,e.clientX-rect.left));sidebar.style.width=w+'px';});
document.addEventListener('mouseup',()=>{isResizing=false;document.body.style.cursor='';});
function toggleSidebar(){
  const btn=document.getElementById('sbToggle');
  sidebar.classList.toggle('collapsed');
  btn.textContent=sidebar.classList.contains('collapsed')?'▶':'◀';
  btn.style.right=sidebar.classList.contains('collapsed')?'-16px':'-16px';
}
// TOAST
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

// HELPERS
function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// INIT
loadData();
buildSidebar();
render();
</script>
</body>
</html>
